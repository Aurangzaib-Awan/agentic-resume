[project]
name = "agentic-resume-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-prebuilt>=1.1.0",
    "psycopg[binary]>=3.3.0",
    "psycopg-pool>=3.3.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.13.0",
    "httpx>=0.28.0",
    "requests>=2.34.0",
]

[tool.vercel]
entrypoint = "core.main:app"